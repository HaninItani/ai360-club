<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>AI360 Club</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

<div id="auth" class="auth-screen">

  <div class="login-card">

    <img
      src="/ai360-logo.png"
      alt="AI360 Club"
      class="login-logo"
    >

    <h1>Welcome to AI360</h1>

    <p>
      Explore ideas, ask questions, and build something new.
    </p>

    <!-- STUDENT / INSTRUCTOR -->
    <div class="tabs">
      <button
        id="studentTab"
        class="selected"
        type="button"
      >
        Student
      </button>

      <button
        id="adminTab"
        type="button"
      >
        Instructor
      </button>
    </div>


    <!-- LOGIN FORM -->
    <form id="loginForm">

      <!-- STUDENT LOGIN -->
      <div id="studentFields">

        <label>
          Student code

          <input
            id="code"
            autocomplete="off"
            placeholder="Enter your code"
          >
        </label>

      </div>


      <!-- INSTRUCTOR LOGIN -->
      <div id="adminFields" hidden>

        <div class="auth-mode">

          <button
            id="instructorLoginMode"
            type="button"
            class="selected"
          >
            Log in
          </button>

          <button
            id="instructorSignupMode"
            type="button"
          >
            Sign up
          </button>

        </div>

        <div
          id="signupNameField"
          hidden
        >

          <label>
            Name

            <input
              id="signupName"
              type="text"
              maxlength="80"
              autocomplete="name"
              placeholder="Your name"
            >
          </label>

        </div>

        <label>
          Email

          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
          >
        </label>

        <label>
          Password

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
          >
        </label>

        <p
          id="signupHint"
          class="muted"
          hidden
        >
          New instructor accounts require approval
          before they can access AI360.
        </p>

      </div>


      <button
        id="authSubmit"
        class="primary wide"
        type="submit"
      >
        Continue
      </button>

      <p
        id="authSuccess"
        role="status"
        hidden
      ></p>

      <p
        id="authError"
        class="error"
        role="alert"
      ></p>

    </form>

  </div>

</div>


<!-- MAIN APP -->

<div
  id="app"
  class="shell"
  hidden
>

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="brand">

      <img
        src="/ai360-logo.png"
        alt="AI360 Club"
      >

      <span>
        AI360
        <small>CLUB WORKSPACE</small>
      </span>

    </div>

    <nav
      id="navigation"
      aria-label="Main navigation"
    ></nav>

    <div class="sidebar-footer">

      <div class="identity">

        <span
          id="avatar"
          class="avatar"
        >
          A
        </span>

        <span>
          <strong id="userName"></strong>
          <small id="userRole"></small>
        </span>

      </div>

      <button
        id="logout"
        class="nav-item"
      >
        ↪ &nbsp; Sign out
      </button>

    </div>

  </aside>


  <div
    id="scrim"
    class="scrim"
  ></div>


  <div class="workspace">

    <header class="topbar">

      <button
        id="menu"
        class="icon-button"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div>
        <small>AI360 CLUB</small>
        <strong id="pageTitle">
          Dashboard
        </strong>
      </div>

      <button
        id="dashboardShortcut"
        class="subtle"
        hidden
      >
        ← Dashboard
      </button>

    </header>

    <main id="content"></main>

  </div>

</div>

<script
  src="/script.js"
  defer
></script>

</body>
</html>

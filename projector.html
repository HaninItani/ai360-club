<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI360 Classroom</title><link rel="stylesheet" href="/styles.css"></head><body class="projector"><header><img src="/ai360-logo.png" alt="AI360 Club"><span>CLASSROOM MODE</span><button onclick="document.documentElement.requestFullscreen()">Full screen ⛶</button></header><main><div class="eyebrow">AI360 · WHERE AI MEETS THE REAL WORLD</div><h1 id="title">Loading classroom…</h1><p id="prompt"></p></main><footer>Led by Hanin Itani <span id="updated"></span></footer><script>async function refresh(){try{const r=await fetch('/api/app?action=classroom');if(!r.ok)throw Error('Sign in to AI360 to view the classroom.');const {classroom}=await r.json();document.querySelector('#title').textContent=classroom.title;document.querySelector('#prompt').textContent=classroom.prompt;document.querySelector('#updated').textContent='Updated '+new Date(classroom.updated_at).toLocaleTimeString()}catch(e){document.querySelector('#title').textContent=e.message}}refresh();setInterval(refresh,3000);</script></body></html>

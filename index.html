<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>AI360 Club</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="auth" class="auth-screen"><div class="login-card"><img src="/ai360-logo.png" alt="AI360 Club" class="login-logo"><h1>Welcome to AI360</h1><p>Explore ideas, ask questions, and build something new.</p><div class="tabs"><button id="studentTab" class="selected">Student</button><button id="adminTab">Instructor</button></div><form id="loginForm"><div id="studentFields"><label>Student code<input id="code" autocomplete="off" placeholder="Enter your code"></label></div><div id="adminFields" hidden><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label></div><button class="primary wide" type="submit">Continue</button><p id="authError" class="error" role="alert"></p></form></div></div>
<div id="app" class="shell" hidden><aside id="sidebar" class="sidebar"><div class="brand"><img src="/ai360-logo.png" alt="AI360 Club"><span>AI360 <small>CLUB WORKSPACE</small></span></div><nav id="navigation" aria-label="Main navigation"></nav><div class="sidebar-footer"><div class="identity"><span id="avatar" class="avatar">A</span><span><strong id="userName"></strong><small id="userRole"></small></span></div><button id="logout" class="nav-item">↪ &nbsp; Sign out</button></div></aside><div id="scrim" class="scrim"></div><div class="workspace"><header class="topbar"><button id="menu" class="icon-button" aria-label="Open menu">☰</button><div><small>AI360 CLUB</small><strong id="pageTitle">Dashboard</strong></div><button id="dashboardShortcut" class="subtle" hidden>← Dashboard</button></header><main id="content"></main></div></div>
<script src="/script.js" defer></script></body></html>

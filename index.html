<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>AI360</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <a class="brand" href="#" aria-label="AI360 home">
          <img src="/ai360-logo.png" alt="AI360 Club" />
          <span>AI360</span>
        </a>
        <button class="icon-btn mobile-only" id="closeSidebar" aria-label="Close sidebar">×</button>
      </div>
      <button class="new-chat" id="newChat"><span>＋</span> New chat</button>
      <div class="history-label">Chats</div>
      <nav class="chat-history" id="chatHistory" aria-label="Chat history"></nav>
      <div class="side-bottom">
        <button class="profile-card" id="profileButton">
          <span class="avatar" id="avatar">H</span>
          <span class="profile-copy"><strong id="profileName">Hanin</strong><small id="profileGroup">AI360 member</small></span>
          <span class="more">•••</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="openSidebar" aria-label="Open sidebar">☰</button>
        <div class="top-title"><strong>AI360</strong><span id="chatTitle">New chat</span></div>
        <div class="top-actions"><span class="status-dot"></span><span class="status-text">AI Assistant</span></div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-mark">✦</div>
          <h1>What can I help with?</h1>
          <p>Ask anything, create something, or continue an idea.</p>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="messageInput" rows="1" placeholder="Message AI360" aria-label="Message AI360"></textarea>
          <div class="composer-footer">
            <div class="composer-tools">
              <button type="button" class="tool-btn" id="imageButton" title="Create an image"><span>◉</span> Image</button>
            </div>
            <button class="send-btn" id="sendButton" type="submit" aria-label="Send message">↑</button>
          </div>
        </form>
        <p class="disclaimer">AI can make mistakes. Check important information and keep personal information private.</p>
      </div>
    </main>
  </div>

  <dialog class="profile-dialog" id="profileDialog">
    <form method="dialog" class="profile-panel">
      <div class="dialog-head"><div><h2>Profile</h2><p>This quietly helps AI360 match the level of explanation.</p></div><button class="icon-btn" value="cancel">×</button></div>
      <label>Display name<input id="nameSetting" maxlength="24" value="Hanin" /></label>
      <label>Learning level<select id="groupSetting"><option value="general">General</option><option value="grades12">Grades 1–2</option><option value="grades35">Grades 3–5</option></select></label>
      <div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button value="default" id="saveProfile" class="primary">Save</button></div>
    </form>
  </dialog>

  <script src="/script.js" defer></script>
</body>
</html>
